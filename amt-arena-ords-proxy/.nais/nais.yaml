kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: {{application_name}}
  namespace: amt
  labels:
    team: amt
spec:
  image: {{image}}
  port: 8080
  terminationGracePeriodSeconds: {{termination_grace_period_seconds}}
  webproxy: true
  ingresses:
    - {{ingress}}
  prometheus:
    enabled: true
    path: /internal/prometheus

  startup:
    path: /internal/health/liveness
    initialDelay: 5
    periodSeconds: 5
    failureThreshold: 10
  readiness:
    path: /internal/health/readiness
  liveness:
    path: /internal/health/liveness

  replicas:
    disableAutoScaling: true
    min: 1
    max: 1
  resources:
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
    limits:
      memory: 1024Mi
  azure:
    application:
      enabled: true
  env:
{{#if jdk_java_options}}
    - name: JDK_JAVA_OPTIONS
      value: "{{jdk_java_options}}"
{{/if}}
    - name: ARENA_ORDS_URL
      value: "{{arena_ords_url}}"
  envFrom:
    - secret: amt-arena-ords-proxy
  accessPolicy:
    inbound:
      rules:
{{#each inbound_rules}}
        - application: {{application}}
          namespace: {{namespace}}
          cluster: {{cluster}}
{{/each}}
