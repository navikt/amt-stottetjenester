kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: amt-person-service
  namespace: amt
  labels:
    team: amt
spec:
  image: {{image}}
  port: 8080
  terminationGracePeriodSeconds: 30

  prometheus:
    enabled: true
    port: "8081"
    path: /actuator/prometheus
  startup:
    port: 8081
    path: /actuator/health/liveness
    initialDelay: 5
    periodSeconds: 5
    failureThreshold: 10
  readiness:
    port: 8081
    path: /actuator/health/readiness
  liveness:
    port: 8081
    path: /actuator/health/liveness

  replicas:
    min: {{replicas_min}}
    max: {{replicas_max}}
{{#if cpu_scaling_threshold}}
    scalingStrategy:
      cpu:
        thresholdPercentage: {{cpu_scaling_threshold}}
{{else}}
    disableAutoScaling: true
{{/if}}
  resources:
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
    limits:
      memory: {{memory_limit}}
  azure:
    application:
      enabled: true
  kafka:
    pool: {{kafka_pool}}
  accessPolicy:
    inbound:
      rules:
        - application: amt-arrangor
        - application: amt-tiltak
        - application: amt-deltaker-bff
        - application: amt-deltaker
        - application: amt-distribusjon
        - application: amt-tiltaksarrangor-bff
    outbound:
      rules:
        - application: poao-tilgang
          namespace: poao
          cluster: {{cluster}}
        - application: veilarbvedtaksstotte
          namespace: obo
          cluster: {{cluster}}
        - application: veilarboppfolging
          namespace: poao
          cluster: {{cluster}}
        - application: logging
          namespace: nais-system
        - application: ao-oppfolgingskontor
          namespace: dab
          cluster: {{cluster}}
      external:
        - host: "{{pdl_host}}"
        - host: "{{digdir_krr_proxy_host}}"
        - host: "{{norg_host}}"
        - host: "{{nom_host}}"
        - host: kodeverk-api.nav.no
  env:
    - name: JDK_JAVA_OPTIONS
      value: "-XX:MaxRAMPercentage=80.0 -Xshare:off --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow"

    - name: PDL_URL
      value: "{{pdl_url}}"
    - name: PDL_SCOPE
      value: "{{pdl_scope}}"

    - name: DIGDIR_KRR_PROXY_URL
      value: "{{digdir_krr_proxy_url}}"
    - name: DIGDIR_KRR_PROXY_SCOPE
      value: api://{{cluster}}.team-rocket.digdir-krr-proxy/.default

    - name: VEILARBOPPFOLGING_URL
      value: http://veilarboppfolging.poao
    - name: VEILARBOPPFOLGING_SCOPE
      value: api://{{cluster}}.poao.veilarboppfolging/.default

    - name: VEILARBVEDTAKSSTOTTE_URL
      value: http://veilarbvedtaksstotte.obo
    - name: VEILARBVEDTAKSSTOTTE_SCOPE
      value: api://{{cluster}}.obo.veilarbvedtaksstotte/.default

    - name: NORG_URL
      value: "{{norg_url}}"

    - name: KODEVERK_URL
      value: https://kodeverk-api.nav.no
    - name: KODEVERK_SCOPE
      value: api://{{cluster}}.team-rocket.kodeverk-api/.default

    - name: POAO_TILGANG_URL
      value: http://poao-tilgang.poao.svc.cluster.local
    - name: POAO_TILGANG_SCOPE
      value: api://{{cluster}}.poao.poao-tilgang/.default

    - name: NOM_URL
      value: "{{nom_url}}"
    - name: NOM_SCOPE
      value: api://{{cluster}}.nom.nom-api/.default

    - name: AO_OPPFOLGINGSKONTOR_URL
      value: http://ao-oppfolgingskontor.dab
    - name: AO_OPPFOLGINGSKONTOR_SCOPE
      value: api://{{cluster}}.dab.ao-oppfolgingskontor/.default

    - name: NOM_MOCK
      value: "{{nom_mock}}"

    - name: SISTE_OPPFOLGINGSPERIODE_TOPIC
      value: poao.siste-oppfolgingsperiode-v3
    - name: SISTE_TILORDNET_VEILEDER_TOPIC
      value: pto.siste-tilordnet-veileder-v1
    - name: AKTOR_V2_TOPIC
      value: pdl.aktor-v2
    - name: SKJERMEDE_PERSONER_STATUS_TOPIC
      value: nom.skjermede-personer-status-v1
    - name: LEESAH_TOPIC
      value: pdl.leesah-v1
    - name: AMT_NAV_BRUKER_TOPIC
      value: amt.nav-bruker-personalia-v1
    - name: AMT_ARRANGOR_ANSATT_PERSONALIA_TOPIC
      value: amt.arrangor-ansatt-personalia-v1
    - name: AMT_NAV_ANSATT_PERSONALIA_TOPIC
      value: amt.nav-ansatt-personalia-v1
    - name: AMT_NAV_ENHET_TOPIC
      value: amt.nav-enhet-v1
    - name: OPPFOLGINGSPERIODE_TOPIC
      value: pto.oppfolgingsperiode-v1
    - name: INNSATSGRUPPE_TOPIC
      value: pto.siste-14a-vedtak-v1

  gcp:
    sqlInstances:
      - name: amt-person-service-2
        tier: {{database_tier}}
        collation: nb_NO.UTF8
        type: POSTGRES_17
        diskAutoresize: {{database_disk_autoresize}}
        highAvailability: {{database_high_availability}}
        pointInTimeRecovery: {{database_point_in_time_recovery}}
        insights:
          enabled: {{database_insights_enabled}}
        databases:
          - name: amt-person-service
            envVarPrefix: DB

  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
