kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: amt-altinn-acl
  namespace: amt
  labels:
    team: amt
spec:
  image: {{image}}
  port: 8080
  terminationGracePeriodSeconds: 60

  prometheus:
    enabled: true
    port: "8081"
    path: /actuator/prometheus
  startup:
    port: 8081
    path: /actuator/health/liveness
    initialDelay: 20
    failureThreshold: 20
  readiness:
    port: 8081
    path: /actuator/health/readiness
  liveness:
    port: 8081
    path: /actuator/health/liveness

  replicas:
    disableAutoScaling: true
    min: 1
    max: 1
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      memory: 512Mi
  leaderElection: true
  env:
    - name: JDK_JAVA_OPTIONS
      value: "-XX:MaxRAMPercentage=70.0"
    - name: ALTINN3_URL
      value: https://platform.tt02.altinn.no
    - name: ALTINN_SCOPE
      value: "{{altinn_scope}}"
  azure:
    application:
      enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: amt-arrangor
    outbound:
      external:
        - host: platform.tt02.altinn.no
  gcp:
    sqlInstances:
      - name: amt-altinn-acl-2
        type: POSTGRES_17
        tier: db-f1-micro
        databases:
          - name: amt-altinn-acl
            envVarPrefix: DB
  maskinporten:
    enabled: true
    scopes:
      consumes:
        - name: "{{altinn_scope}}"

  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki