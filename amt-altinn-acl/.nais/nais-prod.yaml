kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: amt-altinn-acl
  namespace: amt
  labels:
    team: amt
spec:
  image: {{image}}
  port: 8080
  terminationGracePeriodSeconds: 60

  prometheus:
    enabled: true
    port: "8081"
    path: /actuator/prometheus
  startup:
    port: 8081
    path: /actuator/health/liveness
    initialDelay: 20
    failureThreshold: 20
  readiness:
    port: 8081
    path: /actuator/health/readiness
  liveness:
    port: 8081
    path: /actuator/health/liveness

  replicas:
    min: 2
    max: 3
    scalingStrategy:
      cpu:
        thresholdPercentage: 500
  resources:
    requests:
      cpu: 10m
      memory: 600Mi
    limits:
      memory: 1Gi
  azure:
    application:
      enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: amt-arrangor
    outbound:
      external:
        - host: platform.altinn.no
  gcp:
    sqlInstances:
      - name: amt-altinn-acl-3
        type: POSTGRES_17
        tier: db-g1-small
        databases:
          - name: amt-altinn-acl
            envVarPrefix: DB
  leaderElection: true
  env:
    - name: JDK_JAVA_OPTIONS
      value: "-XX:MaxRAMPercentage=75.0 -Xshare:off --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow"
    - name: ALTINN3_URL
      value: https://platform.altinn.no
    - name: ALTINN_SCOPE
      value: "{{altinn_scope}}"
  maskinporten:
    enabled: true
    scopes:
      consumes:
        - name: "{{altinn_scope}}"

  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
