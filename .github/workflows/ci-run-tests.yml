name: Run tests

on:
  merge_group:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: amt-altinn-acl
            task: ":amt-altinn-acl:check"
          - module: amt-arena-acl
            task: ":amt-arena-acl:check"
          - module: amt-arena-ords-proxy
            task: ":amt-arena-ords-proxy:check"
          - module: amt-arrangor
            task: ":amt-arrangor:check"
          - module: amt-enhetsregister
            task: ":amt-enhetsregister:check"
          - module: amt-person-service
            task: ":amt-person-service:check"
          - module: amt-tiltak
            task: ":amt-tiltak:checkAll"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run tests
        env:
          TZ: ${{ matrix.module == 'amt-tiltak' && 'Europe/Oslo' || 'UTC' }}
        run: ./gradlew "${{ matrix.task }}" --no-daemon
