name: Copilot code review setup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-code-review.yml
      - .github/copilot-instructions.md
      - gradle/libs.versions.toml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Read amt-lib dependency version
        id: amt-lib
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib

          with open("gradle/libs.versions.toml", "rb") as catalog:
              version = tomllib.load(catalog)["versions"]["amt-lib"]

          match = re.fullmatch(
              r"1\.\d{4}\.\d{2}\.\d{2}_\d{2}\.\d{2}-([0-9a-f]{7,40})",
              version,
          )
          if match is None:
              raise SystemExit("::error::amt-lib version must contain its release timestamp and source commit SHA")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\nrevision={match.group(1)}\n")
          PY

      - name: Resolve amt-lib source commit
        id: amt-lib-source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AMT_LIB_REVISION: ${{ steps.amt-lib.outputs.revision }}
        run: |
          revision=$(gh api "repos/navikt/amt-deltakelser/commits/$AMT_LIB_REVISION" --jq '.sha')
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ || "$revision" != "$AMT_LIB_REVISION"* ]]; then
            echo "::error::Could not resolve the amt-lib source commit"
            exit 1
          fi
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout amt-lib model sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: navikt/amt-deltakelser
          ref: ${{ steps.amt-lib-source.outputs.revision }}
          path: .copilot-context/amt-deltakelser
          sparse-checkout: amt-lib/models
          persist-credentials: false

      - name: Verify review context
        shell: bash
        env:
          AMT_LIB_VERSION: ${{ steps.amt-lib.outputs.version }}
          AMT_LIB_REVISION: ${{ steps.amt-lib-source.outputs.revision }}
        run: |
          actual_revision=$(git -C .copilot-context/amt-deltakelser rev-parse HEAD)
          if [[ "$actual_revision" != "$AMT_LIB_REVISION" ]]; then
            echo "::error::amt-lib checkout does not match the dependency source commit"
            exit 1
          fi
          if [[ ! -d .copilot-context/amt-deltakelser/amt-lib/models/src/main/kotlin ]]; then
            echo "::error::amt-lib model sources are missing from the review context"
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = {
              "repository": "navikt/amt-deltakelser",
              "dependency_version": os.environ["AMT_LIB_VERSION"],
              "source_commit": os.environ["AMT_LIB_REVISION"],
              "source_directory": ".copilot-context/amt-deltakelser/amt-lib/models/src/main/kotlin",
          }
          Path(".copilot-context/amt-lib-provenance.json").write_text(
              json.dumps(provenance, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          printf 'amt-lib %s (%s) is available in .copilot-context/amt-deltakelser/amt-lib/models\n' \
            "$AMT_LIB_VERSION" "$actual_revision"
          echo "Setup-verified provenance is available in .copilot-context/amt-lib-provenance.json"
