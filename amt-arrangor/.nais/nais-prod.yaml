kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: amt-arrangor
  namespace: amt
  labels:
    team: amt
spec:
  image: {{image}}
  port: 8080
  terminationGracePeriodSeconds: 60

  gcp:
    sqlInstances:
      - name: amt-arrangor-3
        type: POSTGRES_17
        tier: db-custom-1-3840
        databases:
          - name: amt-arrangor
            envVarPrefix: DB
        diskAutoresize: true
        highAvailability: false
        insights:
          enabled: true

  prometheus:
    enabled: true
    port: "8081"
    path: /actuator/prometheus
  startup:
    port: 8081
    path: /actuator/health/liveness
    initialDelay: 10
    failureThreshold: 20
  readiness:
    port: 8081
    path: /actuator/health/readiness
  liveness:
    port: 8081
    path: /actuator/health/liveness

  replicas:
    min: 2
    max: 4
    scalingStrategy:
      cpu:
        thresholdPercentage: 400
  resources:
    requests:
      cpu: 20m
      memory: 550Mi
    limits:
      memory: 1024Mi
  azure:
    application:
      enabled: true
  kafka:
    pool: nav-prod
  leaderElection: true
  tokenx:
    enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: amt-tiltak
        - application: amt-tiltaksarrangor-bff
        - application: amt-aktivitetskort-publisher
        - application: amt-deltaker-bff
        - application: amt-deltaker
    outbound:
      rules:
        - application: amt-enhetsregister
          namespace: amt
          cluster: prod-gcp
        - application: amt-altinn-acl
          namespace: amt
          cluster: prod-gcp
        - application: amt-person-service
          namespace: amt
          cluster: prod-gcp
  env:
    - name: JDK_JAVA_OPTIONS
      value: "-XX:MaxRAMPercentage=60.0 -Xshare:off --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow"

    - name: AMT_ENHETSREGISTER_SCOPE
      value: api://prod-gcp.amt.amt-enhetsregister/.default
    - name: AMT_ENHETSREGISTER_URL
      value: http://amt-enhetsregister.amt.svc.cluster.local
    - name: AMT_ENHETSREGISTER_ALLOWED_HOSTS
      value: amt-enhetsregister.amt.svc.cluster.local

    - name: AMT_ALTINN_URL
      value: http://amt-altinn-acl.amt.svc.cluster.local
    - name: AMT_ALTINN_SCOPE
      value: api://prod-gcp.amt.amt-altinn-acl/.default

    - name: AMT_PERSON_URL
      value: http://amt-person-service.amt.svc.cluster.local
    - name: AMT_PERSON_SCOPE
      value: api://prod-gcp.amt.amt-person-service/.default

  observability:
      autoInstrumentation:
        enabled: true
        runtime: java
      logging:
        destinations:
          - id: elastic
          - id: loki
