cluster: prod-gcp
kafka_pool: nav-prod
jdk_java_options: -XX:MaxRAMPercentage=75.0 -Xshare:off --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow
replicas_min: 1
replicas_max: 2
cpu_scaling_threshold: 150
cpu_request: 20m
memory_request: 800Mi
memory_limit: 1Gi
arena_ords_proxy_host: amt-arena-ords-proxy.prod-fss-pub.nais.io
arena_ords_proxy_scope: api://prod-fss.amt.amt-arena-ords-proxy/.default
arena_ords_proxy_url: https://amt-arena-ords-proxy.prod-fss-pub.nais.io
arena_tiltakgjennomforing_topic: teamarenanais.aapen-arena-tiltakgjennomforingendret-v1-p
arena_tiltak_deltaker_topic: teamarenanais.aapen-arena-tiltakdeltakerendret-v1-p
arena_hist_tiltak_deltaker_topic: teamarenanais.aapen-arena-histtiltakdeltakerendret-v1-p
database_tier: db-custom-1-3840
database_disk_autoresize: true
database_point_in_time_recovery: false
database_flags:
  - name: cloudsql.enable_pgaudit
    value: "on"
  - name: pgaudit.log
    value: write,ddl,role
  - name: pgaudit.log_parameter
    value: "on"
  - name: pgaudit.log_relation
    value: "on"
