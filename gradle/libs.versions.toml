[versions]
# Kotlin og build-plugins
kotlin = "2.4.21"
spring-boot = "4.1.2"
spring-dependency-management = "1.1.7"
ktlint-plugin = "14.2.0"
ktlint-cli-version = "1.8.0"

# Jackson 3 (tools.jackson) og Jackson 2 (com.fasterxml.jackson) holdes adskilt
tools-jackson = "3.2.4"
jackson2-bom = "2.22.4"
jackson2-annotations = "2.22"

# Avro og Kafka
apache-avro = "1.12.2"
confluent = "8.1.1"
kafka-clients = "4.4.0"

# Logging
logstash-encoder = "9.0"
log4j = "2.26.1"

# Nav
nav-common = "4.2026.09.24_06.17-80dfc0eacb29"
amt-lib = "1.2026.10.20_09.19-755cf2186842"
token-support = "7.0.1"
mock-oauth2-server = "6.1.3"
poao-tilgang = "2026.05.05_11.16-1dae3bdff205"

# Diverse
lz4-java = "1.12.0"
nimbus = "11.38.2"
okhttp = "5.5.0"
shedlock = "7.10.1"
unleash = "12.3.1"
postgresql = "42.7.14"
otj-pg-embedded = "1.1.3"

# Testing
kotest = "6.2.6"
mockk = "1.14.11"
springmockk = "5.0.1"
mockito-kotlin = "6.4.0"

# amt-tiltak bruker andre versjoner enn de frittstående appene
tiltak-amt-lib = "1.2026.02.26_12.08-1e4e2b18986e"
tiltak-kafka-clients = "4.4.0"
tiltak-kotest = "5.9.1"
tiltak-lz4-java = "1.12.0"
tiltak-poao-tilgang = "2026.05.05_13.02-76cbce4f654a"
tiltak-testcontainers = "1.21.4"
tiltak-unleash = "12.3.1"

[libraries]
# Build-logikk (buildSrc)
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-spring-gradle-plugin = { module = "org.jetbrains.kotlin.plugin.spring:org.jetbrains.kotlin.plugin.spring.gradle.plugin", version.ref = "kotlin" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin.plugin.serialization:org.jetbrains.kotlin.plugin.serialization.gradle.plugin", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:org.springframework.boot.gradle.plugin", version.ref = "spring-boot" }
spring-dependency-management-gradle-plugin = { module = "io.spring.dependency-management:io.spring.dependency-management.gradle.plugin", version.ref = "spring-dependency-management" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle.ktlint:org.jlleitschuh.gradle.ktlint.gradle.plugin", version.ref = "ktlint-plugin" }
avro-tools = { module = "org.apache.avro:avro-tools", version.ref = "apache-avro" }

# Jackson 3
tools-jackson-core = { module = "tools.jackson.core:jackson-core", version.ref = "tools-jackson" }
tools-jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "tools-jackson" }
tools-jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "tools-jackson" }

# Jackson 2
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2-bom" }
jackson2-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson2-annotations" }

# Avro og Kafka
kafka-avro-serializer = { module = "io.confluent:kafka-avro-serializer", version.ref = "confluent" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka-clients" }

# Logging
logstash-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-encoder" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }

# Nav common
nav-common-audit-log = { module = "no.nav.common:audit-log", version.ref = "nav-common" }
nav-common-job = { module = "no.nav.common:job", version.ref = "nav-common" }
nav-common-kafka = { module = "no.nav.common:kafka", version.ref = "nav-common" }
nav-common-log = { module = "no.nav.common:log", version.ref = "nav-common" }
nav-common-rest = { module = "no.nav.common:rest", version.ref = "nav-common" }
nav-common-token-client = { module = "no.nav.common:token-client", version.ref = "nav-common" }
nav-common-types = { module = "no.nav.common:types", version.ref = "nav-common" }

# Nav security
token-validation-spring = { module = "no.nav.security:token-validation-spring", version.ref = "token-support" }
token-validation-spring-test = { module = "no.nav.security:token-validation-spring-test", version.ref = "token-support" }
mock-oauth2-server = { module = "no.nav.security:mock-oauth2-server", version.ref = "mock-oauth2-server" }

# Nav tilgang
poao-tilgang-client = { module = "no.nav.poao-tilgang:client", version.ref = "poao-tilgang" }

# amt-lib (amt-deltakelser)
amt-lib-models = { module = "no.nav.amt.deltakelser.lib:models", version.ref = "amt-lib" }
amt-lib-spring-boot = { module = "no.nav.amt.deltakelser.lib:spring-boot", version.ref = "amt-lib" }
amt-lib-testing = { module = "no.nav.amt.deltakelser.lib:testing", version.ref = "amt-lib" }
amt-lib-utils = { module = "no.nav.amt.deltakelser.lib:utils", version.ref = "amt-lib" }

# Diverse
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }
lz4-java = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4-java" }
nimbus-oauth2-oidc-sdk = { module = "com.nimbusds:oauth2-oidc-sdk", version.ref = "nimbus" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-jvm = { module = "com.squareup.okhttp3:okhttp-jvm", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
otj-pg-embedded = { module = "com.opentable.components:otj-pg-embedded", version.ref = "otj-pg-embedded" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
shedlock-jdbc-template = { module = "net.javacrumbs.shedlock:shedlock-provider-jdbc-template", version.ref = "shedlock" }
shedlock-spring = { module = "net.javacrumbs.shedlock:shedlock-spring", version.ref = "shedlock" }
unleash = { module = "io.getunleash:unleash-client-java", version.ref = "unleash" }

# Testing
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core-jvm", version.ref = "kotest" }
kotest-extensions-spring = { module = "io.kotest:kotest-extensions-spring", version.ref = "kotest" }
kotest-extensions-testcontainers = { module = "io.kotest:kotest-extensions-testcontainers", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5-jvm", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk-jvm", version.ref = "mockk" }
springmockk = { module = "com.ninja-squad:springmockk", version.ref = "springmockk" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

# amt-tiltak
tiltak-amt-lib-models = { module = "no.nav.amt.lib:models", version.ref = "tiltak-amt-lib" }
tiltak-kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "tiltak-kafka-clients" }
