tiltak-lz4-java = { module = "at.yawk.lz4:lz4-java", version.ref = "tiltak-lz4-java" }
tiltak-poao-tilgang-client = { module = "no.nav.poao-tilgang:client", version.ref = "tiltak-poao-tilgang" }
tiltak-testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "tiltak-testcontainers" }
