kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: amt-enhetsregister
  namespace: amt
  labels:
    team: amt
spec:
  image: {{image}}
  port: 8080

  prometheus:
    enabled: true
    port: "8081"
    path: /actuator/prometheus
  startup:
    port: 8081
    path: /actuator/health/liveness
    initialDelay: 20
    failureThreshold: 15
  readiness:
    port: 8081
    path: /actuator/health/readiness
  liveness:
    port: 8081
    path: /actuator/health/liveness

  replicas:
    min: {{replicas_min}}
    max: {{replicas_max}}
{{#if cpu_scaling_threshold}}
    scalingStrategy:
      cpu:
        thresholdPercentage: {{cpu_scaling_threshold}}
{{else}}
    disableAutoScaling: true
{{/if}}
  resources:
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
    limits:
      memory: 4096Mi # Trenger mye minne når man skal laste ned alle enheter
  azure:
    application:
      enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: amt-arrangor
          namespace: amt
          cluster: {{cluster}}
        - application: aktivitet-arena-acl
          namespace: dab
          cluster: {{cluster}}
        - application: mulighetsrommet-api
          namespace: team-mulighetsrommet
          cluster: {{cluster}}
    outbound:
      external:
        - host: data.brreg.no
  kafka:
    pool: {{kafka_pool}}
  env:
    - name: JDK_JAVA_OPTIONS
      value: "{{jdk_java_options}}"
    - name: VIRKSOMHETER_TOPIC
      value: amt.virksomheter-v1

  gcp:
    sqlInstances:
      - name: amt-enhetsregister-2
        tier: {{database_tier}}
        type: POSTGRES_17
        diskAutoresize: {{database_disk_autoresize}}
        databases:
          - name: amt-enhetsregister
            envVarPrefix: DB

  observability:
      autoInstrumentation:
        enabled: true
        runtime: java
      logging:
        destinations:
          - id: elastic
          - id: loki
